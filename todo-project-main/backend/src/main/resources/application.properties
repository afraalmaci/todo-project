spring.application.name=todo-project

# Database - env vars in production (Render sets these), sane local defaults for dev
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/todo_app_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA
# No migration tool (Flyway/Liquibase) yet, so Hibernate manages the schema itself.
# That's fine for a demo project; swap to Flyway + ddl-auto=validate before this
# ever holds real user data.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Server - Render assigns PORT dynamically
server.port=${PORT:8080}

spring.jackson.serialization.write-dates-as-timestamps=false

# JWT - override APP_JWT_SECRET in every real deployment (32+ random chars)
app.jwt.secret=${APP_JWT_SECRET:dev-only-secret-change-me-before-deploying-32chars-min}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# CORS - comma-separated list of origins allowed to call this API
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
